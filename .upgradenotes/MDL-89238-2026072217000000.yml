issueNumber: MDL-89238
notes:
  core_customfield:
    - message: >-
        MDL-88176 changed `\core_customfield\handler::create()` to cache every
        handler instance and advised extending handlers to remove their own
        `create()` implementations. That advice is superseded. The inherited
        `create()` method again returns a new handler instance by default.
        Handlers that removed their `create()` implementation following
        MDL-88176 and require caching can opt in by declaring
        `protected const CACHE_HANDLER_INSTANCES = true;`.
      type: changed
